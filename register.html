<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Royal RP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Outfit:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#f97316', warmDark: '#1c1715' } } } }
    </script>
    <style>
        .auth-bg { background: linear-gradient(rgba(28,23,21,0.8), rgba(28,23,21,0.8)), url('bg.png') center/cover; backdrop-filter: blur(8px); }
        .glass-panel { background: rgba(38, 31, 28, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.08); }
    </style>
</head>
<body class="auth-bg min-h-screen flex items-center justify-center p-4 text-gray-300">
    <div class="glass-panel w-full max-w-lg rounded-[2rem] p-10 relative overflow-hidden">
        <div class="text-center mb-8">
            <img src="logo.png" class="h-12 mx-auto mb-6">
            <h2 class="text-3xl font-bold text-white">Join the City</h2>
        </div>
        <form id="register-form" class="space-y-4">
            <div class="grid grid-cols-1 gap-4">
                <input type="email" id="reg-email" placeholder="Email" required class="bg-black/20 border border-white/10 rounded-xl py-3 px-4 text-white focus:border-primary outline-none">
            </div>
            <input type="password" id="reg-password" placeholder="Password (6 characters minimum)" required class="w-full bg-black/20 border border-white/10 rounded-xl py-3 px-4 text-white focus:border-primary outline-none">
            <input type="password" id="reg-confirm" placeholder="Confirm Password" required class="w-full bg-black/20 border border-white/10 rounded-xl py-3 px-4 text-white focus:border-primary outline-none">
            <button type="submit" class="w-full bg-primary hover:bg-orange-600 text-white font-bold py-3.5 rounded-xl transition shadow-lg mt-4">Create Account</button>
        </form>
        <p class="mt-8 text-center text-sm">Already registered? <a href="login.html" class="text-primary font-semibold">Sign In</a></p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDZW7T9mxKujkcXoJ81RSp9980xeieGX6k",
            authDomain: "royelrolplay.firebaseapp.com",
            projectId: "royelrolplay",
            storageBucket: "royelrolplay.firebasestorage.app",
            messagingSenderId: "906026544780",
            appId: "1:906026544780:web:00eba4b774eb61651ad5a9",
            measurementId: "G-CHTF9VX0GY"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        document.getElementById('register-form').addEventListener('submit', (e) => {
            e.preventDefault(); // بيمنع الصفحة إنها تعمل ريفريش
            
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const confirmPassword = document.getElementById('reg-confirm').value;

            // التأكد إن الباسورد متطابق
            if(password !== confirmPassword) {
                alert("الباسورد مش متطابق يا بطل، راجعه تاني!");
                return;
            }

            // إرسال البيانات لفايربيز
            createUserWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    alert("تم إنشاء الحساب بنجاح! يا مرحب بيك في Royal RP.");
                    window.location.href = "login.html"; // هيحوله لصفحة تسجيل الدخول
                })
                .catch((error) => {
                    alert("حصلت مشكلة: " + error.message);
                });
        });
    </script>
</body>
</html>
