<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in | Royal RP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        xYellow: '#fbb416', /* الأصفر الخاص بالمنتدى */
                        xDark: '#364150',   /* الرمادي الغامق للهيدر والفوتر */
                        xBg: '#f5f7f9',     /* لون خلفية الفورم */
                        xInput: '#eef2f5',  /* لون خلفية مربعات الكتابة */
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-image: 
                linear-gradient(to right, rgba(28, 23, 21, 0.85) 0%, rgba(28, 23, 21, 0.85) 100%), 
                url('bg.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            backdrop-filter: blur(8px);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 antialiased">

    <div class="w-full max-w-[600px]">
        
        <div class="bg-white rounded-t-lg rounded-b-lg overflow-hidden shadow-2xl">
            
            <div class="bg-xDark px-6 py-4 flex justify-between items-center">
                <h2 class="text-white text-xl font-semibold">Log in</h2>
                <a href="index.html" class="text-gray-400 hover:text-white transition" title="Close">
                    <i class="fas fa-times text-lg"></i>
                </a>
            </div>

            <form id="login-form" onsubmit="event.preventDefault();">
                <div class="bg-white p-6 sm:p-8 space-y-6">
                    
                    <div class="flex flex-col sm:flex-row gap-2 sm:gap-4">
                        <label class="sm:w-1/3 sm:text-right text-sm text-gray-700 font-medium pt-2">Your name or email address:</label>
                        <div class="sm:w-2/3">
                            <input type="email" id="login-email" required 
                                class="w-full bg-xInput border border-gray-200 rounded px-3 py-2 text-sm text-gray-800 focus:outline-none focus:border-gray-400 transition">
                        </div>
                    </div>

                    <div class="flex flex-col sm:flex-row gap-2 sm:gap-4">
                        <label class="sm:w-1/3 sm:text-right text-sm text-gray-700 font-medium pt-2">Password:</label>
                        <div class="sm:w-2/3">
                            <div class="relative">
                                <input type="password" id="login-password" required 
                                    class="w-full bg-xInput border border-gray-200 rounded pl-3 pr-20 py-2 text-sm text-gray-800 focus:outline-none focus:border-gray-400 transition">
                                <button type="button" onclick="togglePassword()" class="absolute right-3 top-1/2 -translate-y-1/2 text-sm text-gray-500 hover:text-gray-800 font-medium flex items-center gap-1.5 transition">
                                    <i id="eye-icon" class="fas fa-eye text-xYellow"></i> Show
                                </button>
                            </div>
                            
                            <a href="#" class="inline-block text-sm text-gray-500 hover:underline mt-3">Forgot your password?</a>
                            
                            <div class="flex items-center gap-2 mt-5">
                                <input type="checkbox" id="stay-logged-in" class="w-4 h-4 accent-xYellow cursor-pointer">
                                <label for="stay-logged-in" class="text-sm text-gray-700 cursor-pointer">Stay logged in</label>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bg-xDark px-6 py-4 flex justify-center border-t border-gray-600">
                    <button type="submit" class="bg-xYellow hover:bg-yellow-500 text-black font-semibold py-2 px-8 rounded shadow-sm flex items-center gap-2 transition transform hover:scale-[1.02]">
                        <i class="fas fa-lock text-xs"></i> LOG IN
                    </button>
                </div>
            </form>
        </div>
        
        <div class="mt-6 flex flex-col sm:flex-row items-center justify-center gap-4">
            <span class="text-gray-300 text-sm">Don't have an account?</span>
            <a href="register.html" class="bg-xYellow hover:bg-yellow-500 text-black font-semibold py-2 px-6 rounded-full text-sm shadow-lg transition transform hover:scale-[1.02]">
                REGISTER NOW
            </a>
        </div>

    </div>

    <script>
        // سكريبت إظهار وإخفاء الباسورد
        function togglePassword() {
            const pwdInput = document.getElementById('login-password');
            const eyeIcon = document.getElementById('eye-icon');
            
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                pwdInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDZW7T9mxKujkcXoJ81RSp9980xeieGX6k",
            authDomain: "royelrolplay.firebaseapp.com",
            projectId: "royelrolplay",
            storageBucket: "royelrolplay.firebasestorage.app",
            messagingSenderId: "906026544780",
            appId: "1:906026544780:web:00eba4b774eb61651ad5a9",
            measurementId: "G-CHTF9VX0GY"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();

            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    alert("Signed in successfully! Welcome back.");
                    window.location.href = "forum.html"; 
                })
                .catch((error) => {
                    alert("Invalid email or password. Please try again.");
                });
        });
    </script>
</body>
</html>
