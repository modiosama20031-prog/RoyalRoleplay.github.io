<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Royal RP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Outfit:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#f97316', warmDark: '#1c1715' } } } }
    </script>
    <style>
        .auth-bg { background: linear-gradient(rgba(28,23,21,0.8), rgba(28,23,21,0.8)), url('bg.png') center/cover; backdrop-filter: blur(8px); }
        .glass-panel { background: rgba(38, 31, 28, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.08); }
    </style>
</head>
<body class="auth-bg min-h-screen flex items-center justify-center p-4 text-gray-300">
    <div class="glass-panel w-full max-w-md rounded-[2rem] p-10 relative overflow-hidden">
        <div class="text-center mb-8">
            <img src="logo.png" class="h-16 mx-auto mb-6">
            <h2 class="text-3xl font-bold text-white">Welcome Back</h2>
        </div>
        <form id="login-form" class="space-y-5">
            <input type="email" id="login-email" placeholder="Email" required class="w-full bg-black/20 border border-white/10 rounded-xl py-3 px-4 text-white focus:border-primary outline-none">
            <input type="password" id="login-password" placeholder="Password" required class="w-full bg-black/20 border border-white/10 rounded-xl py-3 px-4 text-white focus:border-primary outline-none">
            <button type="submit" class="w-full bg-primary hover:bg-orange-600 text-white font-bold py-3.5 rounded-xl transition shadow-lg">Sign In</button>
        </form>
        <p class="mt-8 text-center text-sm">New here? <a href="register.html" class="text-primary font-semibold">Create Account</a></p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDZW7T9mxKujkcXoJ81RSp9980xeieGX6k",
            authDomain: "royelrolplay.firebaseapp.com",
            projectId: "royelrolplay",
            storageBucket: "royelrolplay.firebasestorage.app",
            messagingSenderId: "906026544780",
            appId: "1:906026544780:web:00eba4b774eb61651ad5a9",
            measurementId: "G-CHTF9VX0GY"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();

            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    alert("تم تسجيل الدخول بنجاح! نورت السيرفر.");
                    window.location.href = "forum.html"; // هيدخله على المنتدى بعد التسجيل
                })
                .catch((error) => {
                    alert("الإيميل أو الباسورد غلط، جرب تاني.");
                });
        });
    </script>
</body>
</html>
